<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Black Hole Ray Tracer — Orbit</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; object-fit: contain; cursor: grab; user-select: none; }
  #view.dragging { cursor: grabbing; }
  #hud { position: fixed; top: 8px; left: 8px; font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; pointer-events: none; }
  #controls { position: fixed; bottom: 8px; left: 8px; font-size: 12px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 4px; display: flex; gap: 16px; }
  #controls label { display: flex; flex-direction: column; gap: 2px; }
</style>
</head>
<body>
  <img id="view" src="/image" draggable="false">
  <div id="hud">drag or WASD to orbit · right-drag or ←→/R/F to look · Q/E to roll · scroll or ↑↓ to zoom</div>
  <div id="controls">
    <label>spin a <span id="spinValue">0.000</span>
      <input type="range" id="spinSlider" min="-0.0245" max="0.0245" step="0.0005" value="0">
    </label>
    <label>charge Q <span id="chargeValue">0.000</span>
      <input type="range" id="chargeSlider" min="0" max="0.0245" step="0.0005" value="0">
    </label>
    <label style="flex-direction: row; align-items: center; gap: 6px;">
      <input type="checkbox" id="hqToggle">
      high quality (slow)
    </label>
  </div>

  <script>
    const img = document.getElementById('view');
    const hud = document.getElementById('hud');
    const spinSlider = document.getElementById('spinSlider');
    const chargeSlider = document.getElementById('chargeSlider');
    const spinValue = document.getElementById('spinValue');
    const chargeValue = document.getElementById('chargeValue');
    const hqToggle = document.getElementById('hqToggle');

    const DRAG_SENSITIVITY = 0.008;  // radians per pixel of drag (camera position on the orbit sphere)
    const LOOK_SENSITIVITY = 0.008;  // radians per pixel of right-drag (camera orientation/facing)
    const ZOOM_SENSITIVITY = 0.001;  // exponent per wheel-delta unit
    const ZOOM_SETTLE_DELAY_MS = 250; // wheel has no natural "release" event, so debounce one
    const ZOOM_KEY_FACTOR = 0.97;    // exponent per arrow-key repeat tick
    const ROTATE_KEY_STEP = 0.02;    // radians per wasd repeat tick
    const ROLL_KEY_STEP = 0.03;      // radians per q/e repeat tick
    const LOOK_KEY_STEP = 0.02;      // radians per arrow-left/right or r/f repeat tick

    // w/s look up/down (theta0), a/d turn left/right (phi0): these move the
    // camera's POSITION on the orbit sphere. q/e roll, left/right arrows pan,
    // and r/f tilt the camera's ORIENTATION (independent of position) - the
    // keyboard equivalent of right-drag, for when right-drag isn't usable
    // (e.g. trackpads whose secondary-click gesture never fires a real
    // button-2 mousedown at all). Keyed on the lowercased e.key so Shift+w
    // etc still match.
    const KEY_ACTIONS = {
      w: { dtheta: -ROTATE_KEY_STEP },
      s: { dtheta: ROTATE_KEY_STEP },
      a: { dphi: -ROTATE_KEY_STEP },
      d: { dphi: ROTATE_KEY_STEP },
      q: { droll: -ROLL_KEY_STEP },
      e: { droll: ROLL_KEY_STEP },
      r: { dtilt: -LOOK_KEY_STEP },
      f: { dtilt: LOOK_KEY_STEP },
      arrowleft: { dpan: -LOOK_KEY_STEP },
      arrowright: { dpan: LOOK_KEY_STEP },
      arrowup: { dzoom: ZOOM_KEY_FACTOR },
      arrowdown: { dzoom: 1 / ZOOM_KEY_FACTOR },
    };
    const heldKeys = new Set(); // lets multi-key combos (e.g. w+d) hold "dragging" until ALL are released

    let activeButton = null; // 0 = left (orbit position), 2 = right (look/orientation), null = not dragging
    let lastX = 0, lastY = 0;
    let pendingRequest = false;
    let queued = null; // coalesced request waiting for the in-flight one to finish

    // delta: {dtheta, dphi, dzoom, dpan, dtilt, droll, dragging, a, Q}. a/Q are
    // absolute overrides (omit to leave unchanged); everything else is a delta
    // applied server-side. dtheta/dphi/dzoom move the camera's POSITION on the
    // orbit sphere; dpan/dtilt/droll rotate its ORIENTATION independently.
    function sendOrbit(delta) {
      if (pendingRequest) {
        if (!queued) queued = { dtheta: 0, dphi: 0, dzoom: 1, dpan: 0, dtilt: 0, droll: 0, dragging: delta.dragging };
        queued.dtheta += delta.dtheta || 0;
        queued.dphi += delta.dphi || 0;
        queued.dzoom *= delta.dzoom || 1;
        queued.dpan += delta.dpan || 0;
        queued.dtilt += delta.dtilt || 0;
        queued.droll += delta.droll || 0;
        queued.dragging = delta.dragging;
        if (delta.a !== undefined) queued.a = delta.a;
        if (delta.Q !== undefined) queued.Q = delta.Q;
        return;
      }
      pendingRequest = true;
      const hq = hqToggle.checked;
      const body = {
        dtheta: delta.dtheta || 0, dphi: delta.dphi || 0, dzoom: delta.dzoom || 1,
        dpan: delta.dpan || 0, dtilt: delta.dtilt || 0, droll: delta.droll || 0,
        dragging: delta.dragging, hq,
      };
      if (delta.a !== undefined) body.a = delta.a;
      if (delta.Q !== undefined) body.Q = delta.Q;
      fetch('/orbit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then(r => r.json())
        .then(data => {
          img.src = data.image;
          hud.textContent = `${(data.elapsed * 1000).toFixed(0)} ms/frame` + (delta.dragging ? ' (drag quality)' : ' (settled)');
          // Reflect the server-clamped values back (e.g. a+Q scaled down to
          // stay under the extremal bound) so the sliders never drift out of
          // sync with what actually got rendered.
          spinSlider.value = data.a;
          chargeSlider.value = data.Q;
          spinValue.textContent = data.a.toFixed(4);
          chargeValue.textContent = data.Q.toFixed(4);
          pendingRequest = false;
          if (queued) {
            const next = queued;
            queued = null;
            sendOrbit(next);
          } else if (!delta.dragging && hq) {
            pollForHqUpgrade(data.generation);
          }
        })
        .catch(() => { pendingRequest = false; });
    }

    // The settle render already looks decent; a slower, sharper HQ pass
    // renders in the background and swaps in automatically once ready -
    // but only if the camera hasn't moved on to a new generation since.
    function pollForHqUpgrade(generation, attempt = 0) {
      if (attempt > 30) return; // ~15s ceiling, matches HQ_ACCURACY's worst case
      fetch('/status')
        .then(r => r.json())
        .then(data => {
          if (data.generation !== generation) return; // camera moved on; this poll is stale
          if (data.hq_ready) {
            img.src = `/image?t=${Date.now()}`;
            hud.textContent = 'settled (high quality)';
            return;
          }
          setTimeout(() => pollForHqUpgrade(generation, attempt + 1), 500);
        })
        .catch(() => {});
    }

    // While the camera is settled, the server keeps re-colorizing the last
    // traced frame so the accretion disk reads as flowing material (see
    // web_server.py's animate_flow) - this just keeps pulling those frames in.
    // Skipped while anything else owns img.src (an active drag/settle
    // request in flight, or keys/mouse still held) so it never races them.
    //
    // Self-paced rather than on a fixed timer: each frame is decoded off-screen
    // and only swapped in once it is fully loaded, then the next fetch starts.
    // A fixed interval that outruns the server's publish rate re-requests the
    // same frame and stalls the decode of the next one, which is what made the
    // playback stutter; waiting for the decode instead settles naturally onto
    // whatever rate the server is actually managing.
    const ANIM_MIN_GAP_MS = 40;
    function pullNextFrame() {
      if (pendingRequest || activeButton !== null || heldKeys.size > 0) {
        setTimeout(pullNextFrame, ANIM_MIN_GAP_MS);
        return;
      }
      const started = Date.now();
      const next = new Image();
      const advance = () => {
        setTimeout(pullNextFrame, Math.max(0, ANIM_MIN_GAP_MS - (Date.now() - started)));
      };
      next.onload = () => {
        // Nothing else may have claimed img.src while this frame decoded.
        if (!pendingRequest && activeButton === null && heldKeys.size === 0) img.src = next.src;
        advance();
      };
      next.onerror = advance;
      next.src = `/image?t=${started}`;
    }
    pullNextFrame();

    // Right-click would otherwise open a context menu; right-drag is used
    // for look/orientation instead, so suppress it on the view. Some
    // trackpads' secondary-click gesture never fires a real button-2
    // mousedown at all, and some browsers can swallow the mouseup that was
    // meant to end a right-drag (leaving activeButton stuck) - the r/f and
    // arrow-left/right keys are the reliable fallback for exactly that case.
    img.addEventListener('contextmenu', e => e.preventDefault());

    // Bit for e.buttons corresponding to a given e.button value (0=left, 2=right).
    function buttonBit(button) { return button === 2 ? 2 : 1; }

    img.addEventListener('mousedown', e => {
      if (e.button !== 0 && e.button !== 2) return;
      activeButton = e.button;
      lastX = e.clientX;
      lastY = e.clientY;
      img.classList.add('dragging');
      if (e.button === 2) e.preventDefault();
    });

    window.addEventListener('mousemove', e => {
      if (activeButton === null) return;
      if (!(e.buttons & buttonBit(activeButton))) {
        // The button was released without a mouseup ever reaching us (e.g.
        // eaten by a context menu) - resync from e.buttons instead of
        // trusting a stale activeButton, so drag mode doesn't get stuck.
        activeButton = null;
        img.classList.remove('dragging');
        sendOrbit({ dragging: false });
        return;
      }
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      if (activeButton === 2) {
        // horizontal drag pans, vertical drag tilts - same feel as the left-drag orbit
        sendOrbit({ dpan: -dx * LOOK_SENSITIVITY, dtilt: dy * LOOK_SENSITIVITY, dragging: true });
      } else {
        // vertical drag tilts theta0 (polar angle), horizontal drag spins phi0 (azimuth)
        sendOrbit({ dtheta: dy * DRAG_SENSITIVITY, dphi: -dx * DRAG_SENSITIVITY, dragging: true });
      }
    });

    window.addEventListener('mouseup', () => {
      if (activeButton === null) return;
      activeButton = null;
      img.classList.remove('dragging');
      sendOrbit({ dragging: false }); // one settle-quality re-render at the final angle/orientation
    });

    img.addEventListener('wheel', e => {
      e.preventDefault();
      // scroll up (negative deltaY) zooms in -> factor < 1 -> smaller r0
      const factor = Math.exp(e.deltaY * ZOOM_SENSITIVITY);
      sendOrbit({ dzoom: factor, dragging: true });

      clearTimeout(wheelSettleTimer);
      wheelSettleTimer = setTimeout(() => sendOrbit({ dragging: false }), ZOOM_SETTLE_DELAY_MS);
    }, { passive: false });
    let wheelSettleTimer = null;

    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      const action = KEY_ACTIONS[key];
      if (!action) return;
      e.preventDefault();
      heldKeys.add(key);
      sendOrbit({ ...action, dragging: true });
    });

    window.addEventListener('keyup', e => {
      const key = e.key.toLowerCase();
      if (!KEY_ACTIONS[key]) return;
      heldKeys.delete(key);
      if (heldKeys.size === 0) {
        sendOrbit({ dragging: false }); // one settle-quality re-render once all movement keys are released
      }
    });

    spinSlider.addEventListener('input', () => {
      sendOrbit({ a: parseFloat(spinSlider.value), dragging: true });
    });
    spinSlider.addEventListener('change', () => {
      sendOrbit({ a: parseFloat(spinSlider.value), dragging: false });
    });

    chargeSlider.addEventListener('input', () => {
      sendOrbit({ Q: parseFloat(chargeSlider.value), dragging: true });
    });
    chargeSlider.addEventListener('change', () => {
      sendOrbit({ Q: parseFloat(chargeSlider.value), dragging: false });
    });
  </script>
</body>
</html>
