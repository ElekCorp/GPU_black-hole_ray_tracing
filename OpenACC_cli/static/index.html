<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Black Hole Ray Tracer — Orbit</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; object-fit: contain; cursor: grab; user-select: none; }
  #view.dragging { cursor: grabbing; }
  #hud { position: fixed; top: 8px; left: 8px; font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>
  <img id="view" src="/image" draggable="false">
  <div id="hud">drag to orbit · scroll or ↑↓ to zoom</div>

  <script>
    const img = document.getElementById('view');
    const hud = document.getElementById('hud');

    const DRAG_SENSITIVITY = 0.008;  // radians per pixel of drag
    const ZOOM_SENSITIVITY = 0.001;  // exponent per wheel-delta unit
    const ZOOM_SETTLE_DELAY_MS = 250; // wheel has no natural "release" event, so debounce one
    const ZOOM_KEY_FACTOR = 0.97;    // exponent per arrow-key repeat tick

    let dragging = false;
    let lastX = 0, lastY = 0;
    let pendingRequest = false;
    let queued = null; // coalesced delta waiting for the in-flight request to finish
    let zoomSettleTimer = null;

    function sendOrbit(dtheta, dphi, dzoom, isDragging) {
      if (pendingRequest) {
        queued = queued
          ? { dtheta: queued.dtheta + dtheta, dphi: queued.dphi + dphi, dzoom: queued.dzoom * dzoom, dragging: isDragging }
          : { dtheta, dphi, dzoom, dragging: isDragging };
        return;
      }
      pendingRequest = true;
      fetch('/orbit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dtheta, dphi, dzoom, dragging: isDragging }),
      })
        .then(r => r.json())
        .then(data => {
          img.src = data.image;
          hud.textContent = `${(data.elapsed * 1000).toFixed(0)} ms/frame` + (isDragging ? ' (drag quality)' : ' (settled)');
          pendingRequest = false;
          if (queued) {
            const next = queued;
            queued = null;
            sendOrbit(next.dtheta, next.dphi, next.dzoom, next.dragging);
          } else if (!isDragging) {
            pollForHqUpgrade(data.generation);
          }
        })
        .catch(() => { pendingRequest = false; });
    }

    // The settle render already looks decent; a slower, sharper HQ pass
    // renders in the background and swaps in automatically once ready -
    // but only if the camera hasn't moved on to a new generation since.
    function pollForHqUpgrade(generation, attempt = 0) {
      if (attempt > 30) return; // ~15s ceiling, matches HQ_ACCURACY's worst case
      fetch('/status')
        .then(r => r.json())
        .then(data => {
          if (data.generation !== generation) return; // camera moved on; this poll is stale
          if (data.hq_ready) {
            img.src = `/image?t=${Date.now()}`;
            hud.textContent = 'settled (high quality)';
            return;
          }
          setTimeout(() => pollForHqUpgrade(generation, attempt + 1), 500);
        })
        .catch(() => {});
    }

    img.addEventListener('mousedown', e => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      img.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      // vertical drag tilts theta0 (polar angle), horizontal drag spins phi0 (azimuth)
      sendOrbit(dy * DRAG_SENSITIVITY, -dx * DRAG_SENSITIVITY, 1, true);
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      img.classList.remove('dragging');
      sendOrbit(0, 0, 1, false); // one settle-quality re-render at the final angle
    });

    img.addEventListener('wheel', e => {
      e.preventDefault();
      // scroll up (negative deltaY) zooms in -> factor < 1 -> smaller r0
      const factor = Math.exp(e.deltaY * ZOOM_SENSITIVITY);
      sendOrbit(0, 0, factor, true);

      clearTimeout(zoomSettleTimer);
      zoomSettleTimer = setTimeout(() => sendOrbit(0, 0, 1, false), ZOOM_SETTLE_DELAY_MS);
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      // up zooms in (factor < 1 -> smaller r0), down zooms out
      const factor = e.key === 'ArrowUp' ? ZOOM_KEY_FACTOR : 1 / ZOOM_KEY_FACTOR;
      sendOrbit(0, 0, factor, true);
    });

    window.addEventListener('keyup', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      sendOrbit(0, 0, 1, false); // one settle-quality re-render once the key is released
    });
  </script>
</body>
</html>
